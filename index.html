<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>assessor</title>
  <meta name="description" content="A personal test generator: question banks, algorithmic questions, printed versions and Schoology export.">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header class="app-header">
    <h1><a href="#/">assessor</a></h1>
    <span id="status" class="status"></span>
    <div class="header-actions">
      <button id="open-library" type="button">Open Library…</button>
      <button id="save-library" type="button" class="primary" title="Save Library (⌘S)">Save Library</button>
    </div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <div class="layout">
    <aside id="sidebar" class="sidebar"></aside>
    <main id="main" class="main">
      <!-- Replaced as soon as the app starts. Browsers won't run the app from a file opened directly. -->
      <div class="empty">
        <p>Starting assessor…</p>
        <p>If this message stays, the app can’t run from this address. Browsers block it when <code>index.html</code> is opened directly from a folder. Use <a href="https://karlmcb.github.io/assessor/">karlmcb.github.io/assessor</a>, or run <code>python3 serve.py</code> in the project folder and open <a href="http://127.0.0.1:8642/">127.0.0.1:8642</a>.</p>
      </div>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
