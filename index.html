<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>assessor</title>
  <meta name="description" content="A personal test generator: question banks, algorithmic questions, printed versions and Schoology export.">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div class="app">
    <header class="titlebar">
      <span class="titlebar-app">assessor</span>
      <span id="doc-title" class="titlebar-doc"></span>
      <span id="status" class="status"></span>
    </header>
    <nav id="menubar" class="menubar" aria-label="Menu bar"></nav>
    <div id="toolbar" class="app-toolbar" role="toolbar" aria-label="Toolbar"></div>
    <div id="banner" class="banner" hidden></div>
    <main id="main" class="desk">
      <!-- Replaced as soon as the app starts. Browsers won't run the app from a file opened directly. -->
      <div class="empty">
        <p>Starting assessor…</p>
        <p>If this message stays, the app can’t run from this address. Browsers block it when <code>index.html</code> is opened directly from a folder. Use <a href="https://karlmcb.github.io/assessor/">karlmcb.github.io/assessor</a>, or run <code>python3 serve.py</code> in the project folder and open <a href="http://127.0.0.1:8642/">127.0.0.1:8642</a>.</p>
      </div>
    </main>
    <footer id="docbar" class="docbar" hidden></footer>
    <div id="sheet" class="sheet" hidden>
      <div class="sheet-window" role="dialog" aria-modal="true">
        <button id="sheet-close" class="sheet-close" type="button" aria-label="Close" title="Close (Esc)">✕</button>
        <div id="sheet-body" class="sheet-body"></div>
      </div>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
